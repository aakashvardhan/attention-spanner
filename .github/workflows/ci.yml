name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:e2e
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            e2e/out/
            e2e/baselines/
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            vendor/oxichrome
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: npm ci
      - run: npm run test:rust
      - run: cd vendor/oxichrome && cargo test --workspace --exclude oxichrome --exclude oxichrome-core
      - run: npx playwright install --with-deps chromium
      - run: npm run build:rust
      # Grows as pages are ported; the whole suite at phase 5.
      - run: npm run test:e2e:rust
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-e2e-screenshots
          path: e2e/out/
