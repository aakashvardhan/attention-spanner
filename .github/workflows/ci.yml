name: CI
on:
  push:
  pull_request:
jobs:
  # TypeScript that remains: the brain MCP server, the stylesheet guards
  # (AAA contrast, tokens, motion) and the cut-features guard.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:mcp
  # The extension: Rust compiled to wasm, then the browser suite against it.
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            vendor/oxichrome
      # The CLI must match the crate: read the version from the lockfile.
      - run: cargo install wasm-bindgen-cli --locked --version "$(grep -A1 '^name = "wasm-bindgen"$' rust/Cargo.lock | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
      - run: npm ci
      - run: npm run test:rust
      - run: cd vendor/oxichrome && cargo test --workspace --exclude oxichrome --exclude oxichrome-core
      - run: npx playwright install --with-deps chromium
      - run: npm run build:ext
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            e2e/out/
            e2e/baselines/
