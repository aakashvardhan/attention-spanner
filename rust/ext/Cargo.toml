[package]
name = "reader-ext"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The extension: background worker and Leptos pages, compiled to wasm"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
reader-core = { path = "../core" }
oxichrome = { path = "../../vendor/oxichrome/oxichrome" }
leptos = { version = "0.8.15", features = ["csr"] }
wasm-bindgen = "0.2.108"
wasm-bindgen-futures = "0.4.58"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Response", "Headers", "console", "Window", "Location", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "NodeList", "DomRect", "CssStyleDeclaration", "KeyboardEvent", "MouseEvent", "Event", "ReadableStream", "ReadableStreamDefaultReader", "AbortController", "AbortSignal", "Crypto", "SubtleCrypto", "CryptoKey", "TextEncoder", "TextDecoder", "TextDecodeOptions", "HtmlCanvasElement", "ResizeObserver", "ResizeObserverEntry", "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit", "AddEventListenerOptions", "WheelEvent", "PointerEvent", "TreeWalker", "Node", "Text", "DocumentFragment", "ScrollToOptions", "ScrollBehavior", "MediaQueryList", "Selection", "Range", "DomRectList", "CaretPosition", "DomStringMap", "FocusOptions", "Navigator", "DragEvent", "DataTransfer", "Geolocation", "PositionOptions", "MediaDevices", "MediaStreamConstraints", "MediaStream", "MediaStreamTrack", "AudioContext", "AudioContextOptions", "BaseAudioContext", "AudioWorklet", "Worklet", "AudioWorkletNode", "AudioNode", "AudioParam", "AudioDestinationNode", "BiquadFilterNode", "BiquadFilterType", "MediaStreamAudioSourceNode", "MessagePort", "MessageEvent", "BroadcastChannel", "DomException", "Blob", "BlobPropertyBag", "FormData", "AudioBuffer", "AudioBufferSourceNode", "AudioScheduledSourceNode", "CacheStorage", "Cache", "Request"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
url = "2"

[lints]
workspace = true
